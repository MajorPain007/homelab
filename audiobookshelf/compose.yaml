services:
  audiobookshelf:
    container_name: ${APP_NAME}
    hostname: ${APP_NAME}
    image: ghcr.io/advplyr/audiobookshelf:latest
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    healthcheck:
      disable: true
    ports:
      - 13378:80
    volumes:
      - ${DATA_DIR}:/audiobooks
      - ${EBOOK_DIR}:/ebooks
      - ./audiobookshelf:/config
      - ./audiobookshelf/metadata:/metadata
    labels:
      - traefik.enable=true
      - traefik.http.routers.${APP_NAME}.entrypoints=websecure,homesec
      - traefik.http.routers.${APP_NAME}.rule=Host(`${SUBDOMAIN}.${DOMAIN}`)
      - traefik.http.routers.${APP_NAME}.middlewares=authelia@file
      - net.unraid.docker.managed=composeman
      - net.unraid.docker.webui=http://[IP]:[PORT:80]
      - net.unraid.docker.icon=https://github.com/advplyr/audiobookshelf/raw/master/client/static/Logo.png
      - pangolin.proxy-resources.audiobookshelf.name=audiobookshelf
      - pangolin.proxy-resources.audiobookshelf.full-domain=${SUBDOMAIN}.${DOMAIN}
      - pangolin.proxy-resources.audiobookshelf.protocol=http
      - pangolin.proxy-resources.audiobookshelf.auth.sso-enabled=true
      - pangolin.proxy-resources.audiobookshelf.targets[0].method=http
      - pangolin.proxy-resources.audiobookshelf.targets[0].hostname=audiobookshelf
      - pangolin.proxy-resources.audiobookshelf.targets[0].port=80
      - pangolin.proxy-resources.audiobookshelf.rules[0].action=pass
      - pangolin.proxy-resources.audiobookshelf.rules[0].match=country
      - pangolin.proxy-resources.audiobookshelf.rules[0].value=DE
      - pangolin.proxy-resources.audiobookshelf.rules[0].priority=1
      - pangolin.proxy-resources.audiobookshelf.rules[1].action=deny
      - pangolin.proxy-resources.audiobookshelf.rules[1].match=country
      - pangolin.proxy-resources.audiobookshelf.rules[1].value=ALL
      - pangolin.proxy-resources.audiobookshelf.rules[1].priority=2
    networks:
      - frontend
networks:
  frontend:
    external: true
