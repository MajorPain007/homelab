# Globale Einstellungen
global:
  checkNewVersion: true
  sendAnonymousUsage: false

serversTransport:
  insecureSkipVerify: true

# Log & Accesslog
log:
  # compress: true
  level: INFO
  # filePath: /var/log/traefik/traefik.log
  # maxAge: 14
  # maxBackups: 10
  # maxSize: 100

accessLog:
  # filePath: /var/log/traefik/access.log
  format: json
  bufferingSize: 50
  addInternals: true
  filters:
    statusCodes:
      - "200-299"
      - "400-599"
    retryAttempts: true
    minDuration: 10ms
  fields:
    defaultMode: keep
    headers:
      defaultMode: drop
      names:
        User-Agent: keep
        Authorization: drop
        Content-Type: keep
        X-Special-Header: keep
        CF-Connection-IP: keep
        X-Forwarded-For: keep

# API & Dashboard
api:
  dashboard: true
  insecure: false

# Entrypoints
entryPoints:
  # External
  web:
    address: ":81"
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
          permanent: true
  websecure:
    address: ":444"
    forwardedHeaders:
      trustedIPs:
        - "192.168.2.0/24"
        # BEGIN CLOUDFLARE IPs (managed by script). These will be pulled everyday from https://www.cloudflare.com/ips-v4 & https://www.cloudflare.com/ips-v6
        # Cloudflare IPv4
        - "173.245.48.0/20"
        - "103.21.244.0/22"
        - "103.22.200.0/22"
        - "103.31.4.0/22"
        - "141.101.64.0/18"
        - "108.162.192.0/18"
        - "190.93.240.0/20"
        - "188.114.96.0/20"
        - "197.234.240.0/22"
        - "198.41.128.0/17"
        - "162.158.0.0/15"
        - "104.16.0.0/13"
        - "104.24.0.0/14"
        - "172.64.0.0/13"
        # Cloudflare IPv6
        - "2400:cb00::/32"
        - "2606:4700::/32"
        - "2803:f800::/32"
        - "2405:b500::/32"
        - "2405:8100::/32"
        - "2a06:98c0::/29"
        # END CLOUDFLARE IPs (managed by script)
    http3:
      advertisedPort: 444
    http:
      middlewares:
        - "sec-chain@file"
      tls:
        certResolver: letsencrypt
        domains:
          - main: "yourdomain.com"
            sans:
              - "*.yourdomain.com"
  # Internal
  home:
    address: ":80"
    observability:
      accessLogs: false
    http:
      redirections:
        entryPoint:
          to: homesec
          scheme: https
          permanent: true
  homesec:
    address: ":443"
    observability:
      accessLogs: false
    http3:
      advertisedPort: 443
    http:
      middlewares:
        - "basic-chain@file"
      tls:
        certResolver: letsencrypt
        domains:
          - main: "yourdomain.com" # {{env "DOMAIN"}}
            sans:
              - "*.yourdomain.com" # {{env "DOMAIN"}}

# Provider (Docker & File)
providers:
  docker:
    exposedByDefault: false
    endpoint: "unix:///var/run/docker.sock"
    network: "frontend"
    defaultRule: "Host(`{{ .Name }}.{{ index .Labels \"customLabel\"}}`)"
  file:
    directory: /etc/traefik/conf
    watch: true

# Certificate Resolver (LetsEncrypt via cloudflare)
certificatesResolvers:
  letsencrypt:
    acme:
      email: "user@example.com" # {{env "EMAIL"}}
      storage: /etc/traefik/certs/acme.json
      certificatesDuration: 2160 # 90 Tage
      keyType: EC384
      caServer: "https://acme-v02.api.letsencrypt.org/directory"
      dnsChallenge:
        provider: cloudflare
        resolvers:
          - "1.1.1.1:53"
          - "1.0.0.1:53"
        propagation:
          delayBeforeChecks: 20

# Plugins
experimental:
  plugins:
    crowdsec-bouncer-traefik-plugin:
      moduleName: github.com/maxlerebourg/crowdsec-bouncer-traefik-plugin
      version: v1.4.5
    coraza-http-wasm-traefik:
      moduleName: "github.com/jcchavezs/coraza-http-wasm-traefik"
      version: "v0.3.0"
