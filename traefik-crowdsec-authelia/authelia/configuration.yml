---
###############################################################
#                   Authelia configuration                    #
###############################################################

theme: 'dark'

server:
  address: "tcp://0.0.0.0:9091"

identity_validation:
  reset_password:
    # This secret can also be set using the env variables AUTHELIA_IDENTITY_VALIDATION_RESET_PASSWORD_JWT_SECRET_FILE
    jwt_secret:

session:
  name: authelia_session
  cookies:
    - domain: 'yourdomain.com'
      authelia_url: 'https://auth.yourdomain.com'
      default_redirection_url: 'https://yourdomain.com'
  
  # docker run authelia/authelia:latest authelia crypto rand --length 64 --charset alphanumeric
  secret:
  expiration: 96h
  inactivity: 6h
  remember_me: 1M

log:
  level: info
  format: text
  file_path: /config/authelia.log
  keep_stdout: true

totp:
  issuer: auth.yourdomain.com ### your plain domain
  period: 30
  skew: 1

authentication_backend:
  file:
    path: /config/users_database.yml
    password:
      algorithm: argon2id
      iterations: 1
      salt_length: 16
      parallelism: 8
      memory: 128

###############################################################
#                      Access Control                         #
###############################################################
#
# WICHTIG: Regeln werden von oben nach unten ausgewertet.
# Die ERSTE passende Regel gewinnt.
#

access_control:
  default_policy: deny
  rules:
    # ==================== Lokales Netzwerk ====================
    # Kein Auth nötig wenn aus dem LAN zugegriffen wird
    - domain: "*.yourdomain.com"
      policy: bypass
      networks:
        - 192.168.0.0/16
        - 10.0.0.0/8

    # ==================== Authelia Portal ====================
    # Auth-Portal selbst muss immer erreichbar sein
    - domain: auth.yourdomain.com
      policy: bypass

    # ==================== Vaultwarden Admin blockieren ====================                                                                                                                                   
    - domain: bw.yourdomain.com
      resources:                                                                                                                                                                                               
        - "^/admin([/?].*)?$"                                                                                                                                                                                  
      policy: deny

    # ==================== Vaultwarden API Bypass ====================
    # BW Desktop/Mobile/Browser-Extension braucht diese Pfade ohne 2FA
    - domain: bw.yourdomain.com
      resources:
        - "^/api([/?].*)?$"
        - "^/identity([/?].*)?$"
        - "^/icons([/?].*)?$"
        - "^/notifications([/?].*)?$"
      policy: bypass

    # ==================== Kavita OPDS Feed ====================
    # E-Reader brauchen Zugriff auf den OPDS Feed
    - domain: eb.yourdomain.com
      resources:
        - "^/api/opds([/?].*)?$"
      policy: bypass

    # ==================== Client-App Bypass (bei Bedarf aktivieren) ====================
    # Falls Mobile/Desktop-Clients nicht durch Authelia kommen,
    # die jeweilige Regel unkommentieren.
    #
    # --- Plex ---
    # Plex-Clients (TV, Mobile, Desktop) können kein Authelia 2FA.
    # Option 1: Plex komplett bypassen (Plex hat eigene Auth mit 2FA)
    # - domain: plex.yourdomain.com
    #   policy: bypass
    #
    # Option 2: Nur API-Pfade bypassen
    # - domain: plex.yourdomain.com
    #   resources:
    #     - "^/web([/?].*)?$"
    #     - "^/library([/?].*)?$"
    #     - "^/playQueues([/?].*)?$"
    #   policy: bypass
    #
    # --- Jellyfin ---
    # - domain: jf.yourdomain.com
    #   resources:
    #     - "^/api([/?].*)?$"
    #     - "^/socket([/?].*)?$"
    #     - "^/System([/?].*)?$"
    #   policy: bypass
    #
    # --- Emby ---
    # - domain: emby.yourdomain.com
    #   resources:
    #     - "^/emby([/?].*)?$"
    #     - "^/System([/?].*)?$"
    #   policy: bypass
    #
    # --- Audiobookshelf ---
    # - domain: ab.yourdomain.com
    #   resources:
    #     - "^/api([/?].*)?$"
    #     - "^/s([/?].*)?$"
    #     - "^/login([/?].*)?$"
    #   policy: bypass

    # ==================== Alles andere: 2FA ====================
    - domain: "*.yourdomain.com"
      policy: two_factor

regulation:
  max_retries: 3
  find_time: 120
  ban_time: 600

storage:
  # generate with 'docker run authelia/authelia:latest authelia crypto rand --length 128 --charset alphanumeric'
  encryption_key:
  local:
    path: /config/db.sqlite3

notifier:
  smtp:
    username: user@example.com
    # This secret can also be set using the env variables AUTHELIA_NOTIFIER_SMTP_PASSWORD_FILE
    password:
    address: "submissions://smtp.mail.yahoo.com:465"
    sender: user@example.com
  # For testing purpose, notifications can be sent in a file. 
  # filesystem:
  #   filename: /config/notification.txt
