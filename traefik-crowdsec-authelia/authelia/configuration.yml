---
###############################################################
#                   Authelia configuration                    #
###############################################################

theme: 'dark'

# This secret can also be set using the env variables AUTHELIA_JWT_SECRET_FILE
# generate with 'docker run authelia/authelia:latest authelia crypto rand --length 128 --charset alphanumeric'
jwt_secret:
# default_redirection_url: https://auth.yourdomain.com    ### add your domain of autehlia here
# session:
#   cookies:
#     - domain: 'yourdomain.com.com'
#       authelia_url: 'https://auth.yourdomain.com.com'
#       default_redirection_url: 'https://www.yourdomain.com.com'

session:
  name: authelia_session
  domain: yourdomain.com
  # docker run authelia/authelia:latest authelia crypto rand --length 64 --charset alphanumeric
  secret:
  expiration: 96h
  inactivity: 6h
  remember_me_duration:  1M
log:
  level: info
  format: text
  file_path: /config/authelia.log
  keep_stdout: true

totp:
  issuer: auth.yourdomain.com ### your plain domain
  period: 30
  skew: 1

server:
  host: 0.0.0.0
  port: 9091

# duo_api:
#  hostname: api-123456789.example.com
#  integration_key: ABCDEF
#  # This secret can also be set using the env variables AUTHELIA_DUO_API_SECRET_KEY_FILE
#  secret_key: 1234567890abcdefghifjkl

authentication_backend:
  file:
    path: /config/users_database.yml
    password:
      algorithm: argon2id
      iterations: 1
      salt_length: 16
      parallelism: 8
      memory: 128

access_control:
  default_policy: deny
  rules:
    # Do not authorise while on network
    - domain: "*.yourdomain.com"
      policy: bypass
      networks:
        - 192.168.0.0/16
        - 10.10.10.0/24
    # Rules applied to everyone
    - domain: auth.yourdomain.com
      policy: bypass
    - domain: "*.yourdomain.com"
      resources:
        - ^/api.*$
        - ^/identity.*$
        - ^/system.*$
        - ^/api/opds.*$
      policy: bypass
    - domain: "gotify.yourdomain.com"
      policy: bypass
    - domain: "*.yourdomain.com"
      policy: two_factor


regulation:
  max_retries: 3
  find_time: 120
  ban_time: 600

storage:
# generate with 'docker run authelia/authelia:latest authelia crypto rand --length 128 --charset alphanumeric'
  encryption_key:
  local:
    path: /config/db.sqlite3

notifier:
  smtp:
    username: user@example.com
    # This secret can also be set using the env variables AUTHELIA_NOTIFIER_SMTP_PASSWORD_FILE
    password:
    host:
    port: 465
    sender: user@example.com
  # For testing purpose, notifications can be sent in a file. 
  # filesystem:
  #   filename: /config/notification.txt
