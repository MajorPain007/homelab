services:
  komga:
    container_name: komga
    hostname: komga
    image: gotson/komga
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    ports:
      - 25600:25600/tcp
    volumes:
      - /mnt/user/Daten/Ebooks/:/books:rw
      - ./komga:/config:rw
    environment:
      - KOMGA_LIBRARIES_SCAN_DIRECTORY_EXCLUSIONS=#recycle,@eaDir
    labels:
      - net.unraid.docker.managed=composeman
      - net.unraid.docker.webui=http://[IP]:[PORT:25600]
      - net.unraid.docker.icon=https://raw.githubusercontent.com/selfhosters/unRAID-CA-templates/master/templates/img/komga.png
      - traefik.enable=true
      - traefik.docker.network=frontend
      - traefik.http.routers.komga.entrypoints=websecure,homesec
      - traefik.http.routers.komga.rule=Host(`eb2.${DOMAIN}`)
      - pangolin.proxy-resources.komga.name=komga
      - pangolin.proxy-resources.komga.full-domain=eb2.${DOMAIN}
      - pangolin.proxy-resources.komga.protocol=http
      - pangolin.proxy-resources.komga.auth.sso-enabled=true
      - pangolin.proxy-resources.komga.targets[0].method=http
      - pangolin.proxy-resources.komga.targets[0].hostname=komga
      - pangolin.proxy-resources.komga.targets[0].port=25600
      - pangolin.proxy-resources.komga.rules[0].action=pass
      - pangolin.proxy-resources.komga.rules[0].match=country
      - pangolin.proxy-resources.komga.rules[0].value=DE
      - pangolin.proxy-resources.komga.rules[0].priority=1
      - pangolin.proxy-resources.komga.rules[1].action=deny
      - pangolin.proxy-resources.komga.rules[1].match=country
      - pangolin.proxy-resources.komga.rules[1].value=ALL
      - pangolin.proxy-resources.komga.rules[1].priority=2
    networks:
      - frontend
networks:
  frontend:
    external: true
